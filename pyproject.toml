[project]
name = "ledger"
version = "0.1.0"
description = "Personal finance tool for ingesting bank statements and tracking spending"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber",
    "pyyaml",
    "flask",
    "flask-cors",
    "python-dotenv",
    "pydantic>=2",
    "numpy",
    "sqlite-vec>=0.1.6",   # vector index for merchant similarity (MIT/Apache-2.0)
    "fastembed",           # local ONNX embeddings, bge-small (Apache-2.0; model MIT)
]

[tool.setuptools.packages.find]
include = ["etl*", "api*"]

[project.scripts]
ledger = "etl.cli:main"
