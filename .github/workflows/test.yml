name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vectors]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run the categoriser tests on the NumPy fallback index
        env:
          LEDGER_VECTOR_BACKEND: numpy
        run: python -m pytest tests/test_vector_index.py tests/test_categorizer.py tests/test_categorise_cmd.py tests/test_reimburse.py -v
