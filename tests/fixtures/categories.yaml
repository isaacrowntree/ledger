rules:
  # Every row from this source belongs to one category.
  - type: source
    source_type: airbnb
    category: Airbnb Income

# Merchants filed before any transaction is categorised. Written as they appear
# on a statement; receipt numbers, dates, card digits and suburbs are ignored.
merchants:
  Namecheap, Inc: "Business: Hosting & Infrastructure"
  ICDSoft (Hong Kong) Limited: "Business: Hosting & Infrastructure"
  Twilio: "Business: Software & Subscriptions"
  Google GSUITE_example.com: "Business: Software & Subscriptions"
  Salary Deposit Employer Pty Ltd: Salary
  Interest Credit: Interest Income
  Internal Transfer Transfer To: Transfers
  BPAY Bill Payment: Transfers
  General card deposit: Transfers
  Bank deposit to PayPal account: Transfers
  WOOLWORTHS: Groceries
  COLES: Groceries
  NETFLIX.COM: Subscriptions
  SPOTIFY: Subscriptions
  Uber Australia Pty Ltd: Public Transport
  UBER EATS: Eating Out
  MCDONALDS: Eating Out

tag_rules:
  - tag: flight
    pattern: "JETSTAR|QANTAS|VIRGIN AUSTRALIA"
  - tag: taxi
    pattern: "UBER TRIP|UBER AUSTRALIA|TAXI"
  - tag: train
    pattern: "OPAL|TRANSPORTFORNSW"
  - tag: delivery
    pattern: "UBER ?EATS|DOORDASH|MENULOG"
  - tag: health-insurance
    pattern: "MEDIBANK|AMBULANCE"
  - tag: mobile
    pattern: "OPTUS|VODAFONE|TPG"
  - tag: internet
    pattern: "TPG"
  - tag: water
    pattern: "SYDNEY WATER"
  - tag: biz-hosting
    pattern: "NAMECHEAP|ICDSOFT|DIGITAL ?OCEAN|CLOUDFLARE"
  - tag: biz-software
    pattern: "TWILIO|GOOGLE.?GSUITE|GITHUB|FIGMA|ADOBE"
  - tag: salary
    pattern: "SALARY DEPOSIT"
  - tag: interest
    pattern: "INTEREST CREDIT|CREDIT BONUS INTEREST"
  - tag: rental-income
    pattern: "AIRBNB PAYMENTS|PAYONEER"
  - tag: mortgage
    pattern: "MORTGAGE|OFFSET FACILITY|INTEREST CHARGE"
  - tag: ato-deductible
    pattern: "TWILIO|NAMECHEAP|ICDSOFT|GOOGLE.?GSUITE|GITHUB|FIGMA|ADOBE"
